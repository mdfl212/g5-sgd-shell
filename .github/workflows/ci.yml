name: G5 SGD Shell CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python scripts/check_package.py
      - run: python -m unittest discover -s tests -v
      - run: python scripts/build_deck.py
      - run: python scripts/validate_deck.py dist/g5-demo-deck.pptx --outline examples/demo-outline.json
